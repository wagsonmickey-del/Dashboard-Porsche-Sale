<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Porsche</title>
<style>
:root{--bg:#0b0b0c;--card:#151517;--line:#2a2a2d;--tx:#ececec;--mut:#8d8d93;--red:#d5001c;--gold:#c9a24d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,sans-serif;padding:16px;max-width:1200px;margin:auto}
h1{font-weight:300;letter-spacing:.2em;text-transform:uppercase;font-size:20px;margin:8px 0}h1 b{color:var(--red);font-weight:600}
.bar{height:2px;background:linear-gradient(90deg,var(--red),var(--gold),transparent);margin-bottom:16px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;color:var(--mut);font-size:13px}
.grid{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.c{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kv{font-size:24px;font-weight:600}.kl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--gold);margin:0 0 10px;font-weight:600}
.r{display:grid;grid-template-columns:96px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.t{background:#222;border-radius:4px;height:10px}.t i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff4d5e);border-radius:4px}
.r span:last-child{text-align:right;color:var(--mut)}.n{color:var(--mut);font-size:11px;margin-top:8px}
input,select{background:#1b1b1d;border:1px solid var(--line);color:var(--tx);padding:8px;border-radius:6px;font-size:14px}
.w{overflow-x:auto;max-height:520px;overflow-y:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{position:sticky;top:0;background:#1b1b1d;text-align:left;padding:8px;cursor:pointer;color:var(--gold);font-weight:600}td{padding:7px 8px;border-top:1px solid var(--line)}
.bd{background:#3a0b10;color:#ff8a96;border-radius:4px;padding:1px 6px;font-size:11px}
</style></head><body>

const $=i=>document.getElementById(i),M=v=>'$'+Math.round(v).toLocaleString('en-US'),N=v=>v.toLocaleString('en-US');
const COL=[['id','ID'],['date','Data'],['cust','Cliente'],['model','Modelo'],['year','Ano'],['price','Preço'],['miles','Milhas'],['pay','Pagamento'],['city','Cidade'],['st','UF'],['sp','Vendedor'],['status','Status']];
let sk='id',sd=1;
function grp(a,f){const m={};a.forEach(r=>{const k=f(r);m[k]=m[k]||[0,0];m[k][0]++;m[k][1]+=r.price});return Object.entries(m)}
function bars(id,e,i,fmt){e.sort((a,b)=>b[1][i]-a[1][i]);const mx=e[0]?e[0][1][i]:1;
$(id).innerHTML=e.map(([k,v])=>`<div class="r"><span>${k}</span><div class="t"><i style="width:${v[i]/mx*100}%"></i></div><span>${fmt(v[i])}</span></div>`).join('')}
function rows(){return $('ex').checked?D.filter(r=>r.date!=='INVALID'):D}
function render(){const R=rows(),inv=D.filter(r=>r.date==='INVALID').length,rev=R.reduce((s,r)=>s+r.price,0),del=R.filter(r=>r.status==='Delivered').length;
$('inf').textContent=`${inv} de ${D.length} vendas com data inválida`;
$('kp').innerHTML=[['Vendas',N(R.length)],['Receita',M(rev)],['Ticket médio',M(rev/R.length)],['Entregues',Math.round(del/R.length*100)+'%'],['Cancelamentos',R.filter(r=>r.status==='Cancelled').length]].map(([l,v])=>`<div class="card"><div class="kl">${l}</div><div class="kv">${v}</div></div>`).join('');
bars('g1',grp(R,r=>r.model.split(' ')[0]),1,M);bars('g2',grp(R,r=>r.status),0,N);bars('g3',grp(R,r=>r.pay),0,N);
bars('g4',grp(R,r=>r.st).sort((a,b)=>b[1][1]-a[1][1]).slice(0,8),1,M);
const V=R.filter(r=>r.date!=='INVALID');bars('g5',grp(V,r=>r.date.slice(0,7)).sort(),1,M);
$('g5').innerHTML=$('g5').innerHTML;$('n5').textContent=`${R.length-V.length} venda(s) sem data válida não aparecem neste gráfico.`;
const q=$('q').value.toLowerCase(),s=$('st').value;
let T=R.filter(r=>(!s||r.status===s)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));
T.sort((a,b)=>(a[sk]>b[sk]?1:a[sk]<b[sk]?-1:0)*sd);$('cnt').textContent=T.length+' registros';
$('th').innerHTML='<tr>'+COL.map(c=>`<th onclick="so('${c[0]}')">${c[1]}${c[0]==sk?(sd>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
$('tb').innerHTML=T.map(r=>'<tr>'+COL.map(c=>{let v=r[c[0]];if(c[0]=='price')v=M(v);else if(c[0]=='miles')v=N(v);else if(v==='INVALID')v='<span class="bd">inválida</span>';return`<td>${v}</td>`}).join('')+'</tr>').join('')}
function so(k){sd=sk==k?-sd:1;sk=k;render()}
$('st').innerHTML='<option value="">Todos os status</option>'+[...new Set(D.map(r=>r.status))].sort().map(x=>`<option>${x}</option>`).join('');
['ex','q','st'].forEach(i=>$(i).addEventListener('input',render));render();
